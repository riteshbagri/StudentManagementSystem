# ============================================================
# Student Management System - Application Configuration
# ============================================================

# Application Name
spring.application.name=student-management-system
server.port=8080

# ============================================================
# MySQL Database Configuration
# ============================================================
# DB URL — change host/port if your MySQL runs elsewhere
spring.datasource.url=jdbc:mysql://localhost:3306/student_management_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# IMPORTANT: Set these environment variables before running:
#   Windows CMD:   set DB_USERNAME=root
#                  set DB_PASSWORD=yourpassword
#   PowerShell:    $env:DB_USERNAME="root"
#                  $env:DB_PASSWORD="yourpassword"
#   Linux/Mac:     export DB_USERNAME=root
#                  export DB_PASSWORD=yourpassword
#
# Or replace ${DB_USERNAME} / ${DB_PASSWORD} directly with your credentials.
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# MySQL Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# Spring Data JPA / Hibernate
# ============================================================
# update  = auto-create/alter tables on startup (good for dev)
# validate = only validate — use in production
# create  = drop and recreate on each startup (destructive!)
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================================================
# Jackson (JSON formatting)
# ============================================================
spring.jackson.serialization.indent-output=true

